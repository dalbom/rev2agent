[project]
name = "rev2agent-gui-backend"
version = "0.1.0"
description = "Local browser GUI backend for Rev2Agent"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "openai-codex>=0.1.0b2",
  "pydantic>=2.12.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "httpx2>=2.4.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
